services:
  postgres:
    image: postgres:17
    container_name: petshop-db
    restart: always
    ports:
      - '5500:5432'
    environment:
      POSTGRES_USER: petshop
      POSTGRES_PASSWORD: petshop
      POSTGRES_DB: petshop
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: